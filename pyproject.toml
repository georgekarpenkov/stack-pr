[project]
name = "pstack-pr"
version = "0.2.2"
description = "Export a linear stack of git commits as a chain of stacked GitHub pull requests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "George Karpenkov" }]
keywords = ["stacked-prs", "github", "pull-requests", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/georgekarpenkov/stack-pr"
Repository = "https://github.com/georgekarpenkov/stack-pr"
"Bug Tracker" = "https://github.com/georgekarpenkov/stack-pr/issues"

[project.scripts]
pstack-pr = "pstack_pr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF", "W", "YTT", "ANN", "S",
    "BLE", "FBT", "A", "DTZ", "T10", "ISC", "G", "INP", "PIE", "T20", "PT", "Q",
    "RSE", "RET", "SLF", "TID", "ARG", "PTH", "ERA", "PGH", "PL", "TRY", "FA100",
    "PYI036",
]
ignore = [
    "S603",    # subprocess without shell=True is the whole point of this tool
    "S607",    # we call `git` and `gh` via PATH on purpose
    "TRY003",  # long messages in exceptions are fine for a CLI
    "PLR0913", # many keyword arguments are fine
    "T201",    # this is a CLI, it prints
    "E501",    # long lines in error message templates
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["pstack_pr"]

[tool.ruff.lint.mccabe]
max-complexity = 16

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
    "S101",    # asserts are how tests work
    "ARG",     # fixtures are often unused arguments
    "FBT",     # boolean positional arguments are fine in tests
    "ANN401",  # Any is fine in tests
    "PLR2004", # magic values are fine in tests
    "S108",    # /tmp paths in tests
    "SLF001",  # tests may poke at private members
    "PLR0915", # long test functions are fine
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Run test files in parallel; --dist loadfile keeps each file's tests on one
# worker, which the order-dependent integration tests rely on.
addopts = "-ra -n auto --dist loadfile"
markers = [
    "integration: talks to a real GitHub repository (opt in with --integration)",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]
